<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Appearance before the first paint (no dark flash in the light theme): cached by lib/appearance.ts.
      try {
        const a = JSON.parse(localStorage.getItem('appearance') || '{}')
        const dark = a.theme === 'dark' || (a.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (a.scale) document.documentElement.style.setProperty('--text-scale', String(a.scale / 100))
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Boot splash before any script: the same mark BootScreen (features/system/BootScreen.tsx) then holds and fades. */
      #boot { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: #000; }
      [data-theme='light'] #boot { background: #fff; }
      #boot img { width: 96px; height: 96px; }
    </style>
    <title>Lecture Studio</title>
  </head>
  <body>
    <div id="boot"><img src="/logo.svg" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
