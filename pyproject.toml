[project]
name = "lecture-studio"
version = "1.0.0a9"
description = "Local NotebookLM-style lecture studio: Silero VAD jump-cut, transcription, blunt AI audits"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiofiles>=24.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "psutil>=6.0",
    "mcp>=2.3",
    "numpy>=1.26,<3",
    "soundfile>=0.12",
    "torch>=2.2; sys_platform != 'win32'",
    "silero-vad>=5.1",
    "onnxruntime>=1.19",
    "faster-whisper>=1.1",
    "google-genai>=1.0",
    "pypdf>=5.0",
    "mlx-whisper>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
# Windows picks one torch build per machine (the launcher passes --extra): CUDA only when an NVIDIA GPU can use it.
cpu = ["torch>=2.2; sys_platform == 'win32'"]
cu126 = ["torch>=2.2; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[tool.uv]
package = false
# one torch build per Windows machine: CPU or CUDA, never both
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["frontend", "workspace"]

[tool.ruff.lint]
# errors, pyflakes, warnings, import order, likely bugs, modern syntax
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B008"]  # short names like l in comprehensions; FastAPI's Query() defaults

# Windows: the installer/launcher probe the GPU (nvidia-smi) and sync with --extra cu126 (CUDA 12.6 build, ~2.5 GB) or
# --extra cpu (~200 MB). cu126, not newer: CTranslate2 (faster-whisper) is built for CUDA 12 (cublas64_12.dll).
# Both builds are pinned in uv.lock, so updates never swap one for the other. macOS/Linux keep torch from PyPI.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
